name: D.E.E.P Sovereign AI PC Cockpit CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-ast-scan:
    name: Code Hygiene, AST Analysis & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting & Static Analysis Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Flake8 Critical Syntax & Undefined Name Scan
        run: |
          # Stop build immediately if any syntax error (E9) or undefined name (F63, F7, F82) is found
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Facebook Infer-Style AST Analysis & Resource Leak Scan
        run: |
          # Deep AST scan for unclosed DB/camera handles, silent exception swallows, and SQL injection
          python code_scanner_engine.py

      - name: Zero-Trust Secret Scrubbing Pre-Flight Verification
        run: |
          python sanitize_secrets.py

      - name: Embedded Hardware Rules Verification (PIC18F85K22)
        run: |
          python -c "import code_scanner_engine, sys; res = code_scanner_engine.run_infer_ast_scan('.'); sys.exit(1 if res['embedded_findings'] else 0)"

  unit-regression-suite:
    name: Test Suite (${{ matrix.os }} - Py${{ matrix.python-version }})
    needs: [lint-and-ast-scan]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']
        include:
          - os: ubuntu-latest
            python-version: '3.12'

    env:
      DEEP_CI_MODE: '1'
      HEADLESS: '1'
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Full D.E.E.P 63-Test Regression Suite
        run: |
          python -m unittest discover -p "test_*.py" -v
