version: '3.8'

services:
  # -------------------------------------------------------------
  # High-Speed Ephemeral Cache & Task Queue
  # -------------------------------------------------------------
  deep-redis:
    image: redis:7-alpine
    container_name: deep-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - deep_redis_data:/data
    command: redis-server --appendonly yes --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - deep-net

  # -------------------------------------------------------------
  # Ultra-Low-Latency Vector Database for RAG & Episodic Memory
  # -------------------------------------------------------------
  deep-qdrant:
    image: qdrant/qdrant:latest
    container_name: deep-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - deep_qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__TELEMETRY_DISABLED=true
    networks:
      - deep-net

  # -------------------------------------------------------------
  # Autonomous Workflow Automation Engine (n8n)
  # Connected with Docker MCP profile 'pappiprait'
  # -------------------------------------------------------------
  deep-n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: deep-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Toronto
    volumes:
      - deep_n8n_data:/home/node/.n8n
    networks:
      - deep-net

volumes:
  deep_redis_data:
    name: deep_redis_data
  deep_qdrant_data:
    name: deep_qdrant_data
  deep_n8n_data:
    name: deep_n8n_data

networks:
  deep-net:
    name: deep-network
    driver: bridge
