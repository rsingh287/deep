<aside class="panel-container right-panel hidden" id="panelRight" style="display:flex; flex-direction:column; width:350px; min-width:300px; flex-shrink:0;">
  <div class="panel-header-bar" style="display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--border); background:rgba(15,23,42,0.65);">
    <div style="display:flex; align-items:center; gap:8px;">
      <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#38bdf8; box-shadow:0 0 10px #38bdf8;"></span>
      <span class="panel-header-title" style="letter-spacing:0.5px; font-weight:700; font-size:0.85rem; color:#f1f5f9;">🤖 D.E.E.P • 3D AI BUDDY</span>
    </div>
    <div style="display:flex; align-items:center; gap:6px;">
      <button class="btn-del-chat" onclick="launchDesktopBuddyApp()" title="Pop Out as Native Desktop Buddy (PyWebView Window)" style="padding:2px 8px; font-size:0.72rem; border-radius:6px; background:rgba(56,189,248,0.15); border:1px solid rgba(56,189,248,0.35); color:#38bdf8; cursor:pointer; font-weight:600;">🚀 Pop Out</button>
      <button class="btn-del-chat" onclick="openCompanionStandaloneWindow()" title="Open in Detached Window" style="padding:2px 8px; font-size:0.72rem; border-radius:6px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); color:#94a3b8; cursor:pointer;">🗖 Detach</button>
      <button class="btn-del-chat" onclick="reloadCompanionFrame()" title="Reload 3D Model & Audio" style="padding:2px 8px; font-size:0.72rem; border-radius:6px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); color:#94a3b8; cursor:pointer;">🔄</button>
      <button class="btn-del-chat" onclick="toggleRightPanel()" title="Hide 3D Buddy Panel">✕</button>
    </div>
  </div>

  <!-- Buddy Content: Embedded 3D AI Assistant (Lazy-Loaded On Demand) -->
  <div id="panelBuddyContent" class="panel-content" style="display:flex; flex-direction:column; padding:0; flex:1; overflow:hidden; position:relative; min-height:0; background:transparent;">
    <iframe id="companionFrame" src="about:blank" data-src="/floating_assistant_app/?standalone=true" style="width:100%; height:100%; min-height:480px; border:none; background:transparent; display:block;" allow="microphone; autoplay"></iframe>
  </div>
</aside>
