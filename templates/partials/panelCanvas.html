<aside class="panel-container canvas-panel hidden" id="panelCanvas" style="display:flex; flex-direction:column; width:460px; min-width:320px; max-width:680px; flex-shrink:0;">
  <div class="panel-header-bar" style="display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--border); background:rgba(15,23,42,0.75);">
    <div style="display:flex; align-items:center; gap:8px;">
      <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#c084fc; box-shadow:0 0 10px #c084fc;"></span>
      <span class="panel-header-title" style="letter-spacing:0.5px; font-weight:700; font-size:0.85rem; color:#f1f5f9;">🎨 ARTIFACT CANVAS</span>
      <span style="font-size:0.7rem; color:#c084fc; background:rgba(168,85,247,0.15); border:1px solid rgba(168,85,247,0.3); padding:1px 6px; border-radius:4px; font-family:'JetBrains Mono',monospace;">LIVE PREVIEW</span>
    </div>
    <div style="display:flex; align-items:center; gap:6px;">
      <button class="btn-del-chat" onclick="openCanvasStandaloneWindow()" title="Pop Out Artifact Canvas in New Window" style="padding:2px 8px; font-size:0.72rem; border-radius:6px; background:rgba(168,85,247,0.15); border:1px solid rgba(168,85,247,0.35); color:#c084fc; cursor:pointer; font-weight:600;">🗖 Pop Out</button>
      <button class="btn-del-chat" onclick="refreshArtifactCanvas()" title="Refresh Render" style="padding:2px 8px; font-size:0.72rem; border-radius:6px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); color:#94a3b8; cursor:pointer;">🔄</button>
      <button class="btn-del-chat" onclick="toggleArtifactCanvas()" title="Close Artifact Canvas">✕</button>
    </div>
  </div>

  <!-- Interactive Sandbox Live Render Body -->
  <div style="flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative; background:#070a12;">
    <iframe id="artifactCanvasFrame" style="flex:1; width:100%; height:100%; border:none; background:#ffffff;" sandbox="allow-scripts allow-same-origin allow-modals allow-forms"></iframe>
  </div>
</aside>
