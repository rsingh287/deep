<header class="top-bar">
    <!-- LEFT: BRAND LOGO, SYSTEM STATUS & LAYOUT TOGGLES -->
    <div class="top-bar-left">
      <div class="ai-agent-logo-badge" title="AI Agent Workstation Core" style="display:flex; align-items:center; justify-content:center; width:30px; height:30px; background:linear-gradient(135deg, rgba(56,189,248,0.25), rgba(168,85,247,0.25)); border:1px solid rgba(56,189,248,0.5); border-radius:8px; margin-right:4px; box-shadow:0 0 15px rgba(56,189,248,0.35);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent-cyan)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
          <path d="M2 17l10 5 10-5"></path>
          <path d="M2 12l10 5 10-5"></path>
        </svg>
      </div>


      <div class="status-group" style="margin-left:6px;">
        <div class="status-badge">
          <span class="status-dot"></span>
          ACTIVE
        </div>
        <div class="status-badge" id="ollamaStatusBadge" style="background:rgba(56,189,248,0.12); border-color:rgba(56,189,248,0.3); color:var(--accent-cyan);">
          <span class="status-dot" id="ollamaStatusDot" style="background:var(--accent-cyan); box-shadow:0 0 10px var(--accent-cyan);"></span>
          <span id="ollamaStatusText">OLLAMA READY</span>
        </div>
      </div>

      <!-- IDE Quick Layout Panel Toggles -->
      <div class="layout-toolbar" style="margin-left:10px;">
        <button class="btn-layout-toggle" onclick="toggleLeftPanel()" title="Toggle Sidebar (Chats / Tools / Vitals)" id="btnToggleLeft">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
          </svg>
        </button>
        <button class="btn-layout-toggle" onclick="toggleBottomPanel()" title="Toggle Bottom Console Terminal" id="btnToggleBottom">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="15" x2="21" y2="15"></line>
          </svg>
        </button>
        <button class="btn-layout-toggle" onclick="toggleArtifactCanvas()" title="Toggle Artifact Canvas (Code & UI Preview)" id="btnToggleCanvas">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <path d="M8 12h8"></path>
            <path d="M12 8v8"></path>
          </svg>
        </button>
        <button class="btn-layout-toggle" onclick="toggleRightPanel()" title="Toggle 3D AI Buddy" id="btnToggleRight">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="10" rx="2"></rect>
            <circle cx="12" cy="5" r="2"></circle>
            <path d="M12 7v4"></path>
            <circle cx="8" cy="16" r="1" fill="currentColor"></circle>
            <circle cx="16" cy="16" r="1" fill="currentColor"></circle>
          </svg>
        </button>
      </div>
    </div>

    <!-- CENTER: AUTOMATIC AI MODEL SELECTOR & ACTIVE SKILL BADGE -->
    <div class="top-bar-center" style="display:flex; align-items:center; gap:10px;">
      <div style="display:inline-flex; align-items:center; gap:8px; padding:4px 14px; background:rgba(15,23,42,0.85); border:1px solid rgba(56,189,248,0.4); border-radius:20px; font-size:0.8rem; box-shadow:0 0 14px rgba(56,189,248,0.18);">
        <span id="activeModelDot" style="display:inline-block; width:7px; height:7px; border-radius:50%; background:#4ade80; box-shadow:0 0 8px #4ade80;"></span>
        <label for="modelSelect" style="color:#94a3b8; font-weight:600; font-size:0.75rem; margin:0;">AI Model:</label>
        <select id="modelSelect" onchange="onModelSelectChange(this.value)" style="background:transparent; border:none; color:#38bdf8; font-weight:700; font-size:0.8rem; cursor:pointer; outline:none; padding:2px 0;">
          <optgroup label="⚡ Fast Real-Time (Ollama / GGUF)">
            <option value="auto" style="background:#0f172a; color:#38bdf8;" selected>⚡ Auto (Workload Router)</option>
            <option value="qwen2.5-coder:7b" style="background:#0f172a; color:#f8fafc;">💻 Qwen 2.5 Coder 7B (Code & Web)</option>
            <option value="deepseek-r1:8b" style="background:#0f172a; color:#f8fafc;">🧠 DeepSeek R1 8B (Reasoning & Math)</option>
            <option value="qwen2.5vl:7b" style="background:#0f172a; color:#f8fafc;">👁️ Qwen 2.5-VL 7B (Vision & OCR)</option>
            <option value="qwen2.5:3b" style="background:#0f172a; color:#f8fafc;">⚡ Qwen 2.5 3B (Fast Reflex & Banter)</option>
            <option value="qwen2.5:7b" style="background:#0f172a; color:#f8fafc;">🌐 Qwen 2.5 7B (General Balanced)</option>
          </optgroup>
        </select>
        <span id="activeAutoModelLabel" style="display:none;">Auto</span>
      </div>
      <div id="activeSkillBadge" style="display:none; align-items:center; gap:6px; padding:4px 12px; background:rgba(234,179,8,0.15); border:1px solid rgba(234,179,8,0.5); border-radius:20px; font-size:0.78rem; color:#facc15; box-shadow:0 0 10px rgba(234,179,8,0.2);">
        <span>⚡ Skill:</span>
        <strong id="activeSkillNameText" style="max-width:140px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">None</strong>
        <button onclick="clearActiveSkillInCockpit(event)" style="background:transparent; border:none; color:#facc15; cursor:pointer; font-weight:700; margin-left:4px; font-size:0.85rem;" title="Disengage Active Skill">✕</button>
      </div>
    </div>

    <!-- RIGHT: MINIMALIST VOICE STATUS, LOCATION & COMMAND DRAWER -->
    <div class="top-bar-right" style="display:flex; align-items:center; gap:8px;">
      <a href="/gurbani" id="topGurbaniBadge" class="btn-cmd-palette" style="text-decoration:none; display:flex; align-items:center; gap:6px; font-weight:700; padding:5px 12px; background:rgba(234,179,8,0.12); border:1px solid rgba(234,179,8,0.4); border-radius:10px; color:#facc15; font-size:0.82rem;" title="ੴ Sikh Heritage & Nitnem Engine (100% Offline)">
        <span>ੴ</span> <span>Nitnem</span>
      </a>

      <a href="/weather" id="topLocationBadge" class="btn-cmd-palette" style="text-decoration:none; display:flex; align-items:center; gap:6px; font-weight:600; padding:5px 12px; background:rgba(16,185,129,0.12); border:1px solid rgba(16,185,129,0.35); border-radius:10px; color:#10b981; font-size:0.82rem;" title="Current Location (Sudbury, ON)">
        <span>📍</span> <span id="topLocationText">Sudbury, ON</span>
      </a>

      <!-- Quick Living Vocal State Pill -->
      <div id="topVocalStatusPill" onclick="toggleMainVoiceMic()" style="display:inline-flex; align-items:center; gap:8px; padding:5px 14px; background:rgba(15,23,42,0.8); border:1px solid rgba(56,189,248,0.4); border-radius:20px; font-size:0.8rem; font-weight:700; color:#38bdf8; cursor:pointer; transition:all 0.2s; box-shadow:0 0 12px rgba(56,189,248,0.15);" title="Toggle Continuous Listening (Click or Spacebar)">
        <span id="topVocalDot" style="width:7px; height:7px; border-radius:50%; background:#38bdf8; box-shadow:0 0 8px #38bdf8; transition:all 0.2s;"></span>
        <span id="topVocalText">🎙️ Voice Ready</span>
      </div>

      <!-- Quick Living TTS Spoken Response Toggle Button -->
      <button id="topTTSToggleBtn" onclick="toggleTTS()" class="btn-cmd-palette" style="display:inline-flex; align-items:center; gap:6px; font-weight:700; padding:5px 12px; background:rgba(30,41,59,0.85); border:1px solid rgba(148,163,184,0.3); border-radius:10px; color:#94a3b8; font-size:0.8rem; cursor:pointer; transition:all 0.2s;" title="Toggle AI Spoken Voice Responses (TTS)">
        <span id="topTTSIcon">🔇</span> <span id="topTTSText">Voice: OFF</span>
      </button>



      <!-- Slide-Out Command Drawer Trigger -->
      <button onclick="toggleCommandDrawer(true)" id="btnOpenCommandDrawer" class="btn-cmd-palette" style="display:flex; align-items:center; gap:8px; font-weight:700; padding:6px 14px; background:linear-gradient(135deg, rgba(56,189,248,0.2), rgba(168,85,247,0.2)); border:1px solid rgba(56,189,248,0.5); border-radius:10px; color:#ffffff; font-size:0.84rem; cursor:pointer; box-shadow:0 0 15px rgba(56,189,248,0.25); transition:all 0.2s;" title="Open All Subsystems & Tools (or say 'Open Menu')">
        <span>⌘</span> Command Drawer
      </button>



      <button class="btn-emergency" onclick="emergencyStop()" title="Emergency Halt (or say 'Stop')">🛑</button>
    </div>
  </header>
