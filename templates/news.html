<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deep AI Workstation • Live Global News & Intelligence Wire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070a13;
      --panel: rgba(13, 20, 36, 0.78);
      --border: rgba(56, 189, 248, 0.22);
      --cyan: #38bdf8;
      --cyan-glow: rgba(56, 189, 248, 0.4);
      --emerald: #10b981;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 15%, rgba(56,189,248,0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 85%, rgba(16,185,129,0.06) 0%, transparent 40%),
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
      color: var(--text);
      font-family: 'Rajdhani', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: var(--panel);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      font-size: 24px;
      width: 40px;
      height: 40px;
      background: rgba(56,189,248,0.15);
      border: 1px solid var(--cyan);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px var(--cyan-glow);
    }
    .brand-text h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.15rem;
      letter-spacing: 1.5px;
      color: #fff;
    }
    .brand-text p {
      font-size: 0.8rem;
      color: var(--cyan);
      letter-spacing: 1px;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn {
      padding: 6px 14px;
      border-radius: 8px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      border: 1px solid var(--border);
      background: rgba(15,23,42,0.8);
      color: var(--text);
    }
    .btn:hover {
      border-color: var(--cyan);
      color: var(--cyan);
      box-shadow: 0 0 12px var(--cyan-glow);
    }
    .btn-primary {
      background: linear-gradient(135deg, rgba(56,189,248,0.25), rgba(16,185,129,0.25));
      border-color: var(--cyan);
      color: var(--cyan);
    }
    .ticker-tape {
      background: rgba(15,23,42,0.9);
      border-bottom: 1px solid var(--border);
      padding: 6px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      overflow: hidden;
      white-space: nowrap;
    }
    .ticker-label {
      background: var(--rose);
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 800;
      font-size: 0.75rem;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }
    .ticker-text {
      color: var(--cyan);
      display: inline-block;
      animation: scroll 35s linear infinite;
    }
    @keyframes scroll {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    .content-area {
      flex: 1;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
    }
    .filters-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--panel);
      padding: 12px 18px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .category-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .pill {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--muted);
      transition: all 0.2s;
    }
    .pill:hover, .pill.active {
      background: var(--cyan);
      color: #000;
      border-color: var(--cyan);
      box-shadow: 0 0 10px var(--cyan-glow);
    }
    .search-box {
      display: flex;
      align-items: center;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 12px;
      width: 280px;
    }
    .search-box input {
      background: none;
      border: none;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      width: 100%;
    }
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 16px;
    }
    .news-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all 0.2s;
      position: relative;
    }
    .news-card:hover {
      transform: translateY(-3px);
      border-color: var(--cyan);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5), 0 0 16px var(--cyan-glow);
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
    }
    .card-cat {
      background: rgba(56,189,248,0.15);
      color: var(--cyan);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .card-time {
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }
    .card-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.18rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.35;
    }
    .card-summary {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.5;
      flex: 1;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.06);
      font-size: 0.82rem;
    }
    .source-tag {
      color: var(--emerald);
      font-weight: 600;
    }
    .btn-read {
      color: var(--cyan);
      text-decoration: none;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-read:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <div class="brand">
      <div class="brand-icon">📰</div>
      <div class="brand-text">
        <h1>GLOBAL CYBER INTELLIGENCE WIRE</h1>
        <p>Real-Time Aggregated Global News & Market Breakers</p>
      </div>
    </div>
    <div class="nav-actions">
      
      
      <a href="/" class="btn">💬 Back to AI Cockpit</a>
    </div>
  </header>

  <!-- Live Ticker Ribbon -->
  <div class="ticker-tape">
    <span class="ticker-label">BREAKING</span>
    <span class="ticker-text" id="tickerContent">
      Loading latest global wire intelligence...
    </span>
  </div>

  <main class="content-area">
    <!-- Category & Search Bar -->
    <div class="filters-bar">
      <div class="category-pills">
        <div class="pill active" onclick="setCategory('all', this)">🌐 All Wire</div>
        <div class="pill" onclick="setCategory('tech', this)">🤖 AI & Technology</div>
        <div class="pill" onclick="setCategory('finance', this)">📈 Financial & Sharemarket</div>
        <div class="pill" onclick="setCategory('world', this)">🌍 World & Geopolitics</div>
        <div class="pill" onclick="setCategory('science', this)">🔬 Science & Cyber</div>
      </div>
      <div class="search-box">
        <span style="margin-right:8px; color:var(--muted);">🔍</span>
        <input type="text" id="searchInput" placeholder="Filter articles by keywords..." oninput="filterArticles()">
      </div>
    </div>

    <!-- Dynamic Articles Grid -->
    <div class="news-grid" id="newsGrid">
      <div style="grid-column:1/-1; text-align:center; padding:50px; color:var(--muted);">
        Fetching live global wire feeds...
      </div>
    </div>
  </main>

  <script>
    let currentCategory = 'all';
    let allArticles = [];

    async function fetchLiveNews() {
      const grid = document.getElementById('newsGrid');
      grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--cyan);">⚡ Streaming latest worldwide newsfeeds...</div>';
      try {
        const res = await fetch('/api/news');
        const data = await res.json();
        allArticles = data.articles || [];
        updateTicker();
        renderArticles();
      } catch (err) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--rose);">Error loading news: ${err.message}</div>`;
      }
    }

    function updateTicker() {
      if (allArticles.length > 0) {
        const ticker = document.getElementById('tickerContent');
        ticker.textContent = allArticles.map(a => `● [${a.category.toUpperCase()}] ${a.title} (${a.source})`).join('     ');
      }
    }

    function setCategory(cat, el) {
      currentCategory = cat;
      document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      renderArticles();
    }

    function filterArticles() {
      renderArticles();
    }

    function renderArticles() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const grid = document.getElementById('newsGrid');
      
      let filtered = allArticles;
      if (currentCategory !== 'all') {
        filtered = filtered.filter(a => a.category.toLowerCase() === currentCategory);
      }
      if (query) {
        filtered = filtered.filter(a => a.title.toLowerCase().includes(query) || a.summary.toLowerCase().includes(query));
      }

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--muted);">No matching dispatches found. Try a different category or search term.</div>';
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <article class="news-card">
          <div class="card-meta">
            <span class="card-cat">${item.category.toUpperCase()}</span>
            <span class="card-time">${item.time_ago || 'Recent'}</span>
          </div>
          <h2 class="card-title">${item.title}</h2>
          <p class="card-summary">${item.summary}</p>
          <div class="card-footer">
            <span class="source-tag">📡 ${item.source}</span>
            <a href="${item.url || '#'}" target="_blank" rel="noopener" class="btn-read">Read Full ↗</a>
          </div>
        </article>
      `).join('');
    }

    function speakHeadlines() {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const top3 = allArticles.slice(0, 3).map(a => a.title).join('. Next headline: ');
      const utterance = new SpeechSynthesisUtterance("Here are the top headlines: " + top3);
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    fetchLiveNews();
  </script>
</body>
</html>
