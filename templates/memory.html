<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory DB & Knowledge Store - Deep AI Cockpit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070a12;
      --card-bg: rgba(15, 23, 42, 0.75);
      --border: rgba(56, 189, 248, 0.2);
      --accent-cyan: #38bdf8;
      --accent-purple: #c084fc;
      --accent-green: #4ade80;
      --accent-red: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(circle at 50% 20%, #0d162a 0%, var(--bg-dark) 100%);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Header */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: rgba(10, 15, 29, 0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(56, 189, 248, 0.3));
      border: 1px solid var(--accent-purple);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
    }

    .brand-title h1 {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .brand-title p {
      font-size: 0.75rem;
      color: var(--accent-purple);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.06em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-return {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid var(--accent-cyan);
      color: #fff;
      padding: 8px 18px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-return:hover {
      background: var(--accent-cyan);
      color: #000;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      transform: translateY(-1px);
    }

    /* Main Container */
    .main-content {
      flex: 1;
      padding: 1.8rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.6rem;
    }

    /* Stats Bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.2rem;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem 1.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .stat-info h3 {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .stat-info p {
      font-size: 1.6rem;
      font-weight: 800;
      font-family: 'Rajdhani', sans-serif;
      margin-top: 2px;
    }

    /* Form Card */
    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .form-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f1f5f9;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 2fr auto;
      gap: 10px;
    }

    @media (max-width: 768px) {
      .input-row { grid-template-columns: 1fr; }
      .stats-bar { grid-template-columns: 1fr; }
    }

    .input-box {
      background: rgba(7, 10, 19, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-box:focus {
      border-color: var(--accent-purple);
      box-shadow: 0 0 10px rgba(192, 132, 252, 0.3);
    }

    .btn-save {
      background: linear-gradient(135deg, #0284c7, #9333ea);
      border: none;
      color: #fff;
      padding: 10px 24px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-save:hover {
      box-shadow: 0 0 20px rgba(147, 51, 234, 0.5);
      transform: translateY(-1px);
    }

    /* Search & Filter Bar */
    .filter-bar {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .search-input {
      flex: 1;
      background: rgba(7, 10, 19, 0.7);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      color: #fff;
      font-size: 0.82rem;
      outline: none;
    }

    /* Facts Grid */
    .facts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 1.2rem;
    }

    .fact-card {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }
    .fact-card:hover {
      border-color: var(--accent-purple);
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 8px 25px rgba(168, 85, 247, 0.2);
    }

    .fact-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .concept-badge {
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid rgba(168, 85, 247, 0.4);
      color: var(--accent-purple);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .fact-content {
      font-size: 0.84rem;
      color: #cbd5e1;
      line-height: 1.5;
      font-family: 'JetBrains Mono', monospace;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 180px;
      overflow-y: auto;
    }

    .fact-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 8px;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .btn-del {
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: var(--accent-red);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-del:hover {
      background: var(--accent-red);
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header-bar">
    <div class="header-left">
      <div class="brand-icon">🧠</div>
      <div class="brand-title">
        <h1>MEMORY DB & KNOWLEDGE STORE</h1>
        <p>PERSISTENT AGENTIC FACTS • RAG RECALL • CONTEXTUAL KNOWLEDGE GRAPH</p>
      </div>
    </div>

    <div class="header-right">
      <a href="/" class="btn-return">← Return to Full AI Cockpit</a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-info">
          <h3>Total Learned Facts</h3>
          <p id="statTotalFacts" style="color:var(--accent-purple);">0</p>
        </div>
        <div style="font-size:2rem; opacity:0.6;">📚</div>
      </div>
      <div class="stat-card">
        <div class="stat-info">
          <h3>Active Concepts</h3>
          <p id="statTotalConcepts" style="color:var(--accent-cyan);">0</p>
        </div>
        <div style="font-size:2rem; opacity:0.6;">💡</div>
      </div>
      <div class="stat-card">
        <div class="stat-info">
          <h3>Storage Engine</h3>
          <p style="font-size:1.1rem; color:var(--accent-green); margin-top:8px;">SQLite (memory.db)</p>
        </div>
        <div style="font-size:2rem; opacity:0.6;">💾</div>
      </div>
    </div>

    <!-- Add Fact Form -->
    <div class="form-card">
      <div class="form-title">
        <span>➕ Store New Knowledge Fact</span>
      </div>
      <div class="input-row">
        <input type="text" class="input-box" id="factConcept" placeholder="Concept / Tag (e.g. Favorite Language, Project Rules)" />
        <input type="text" class="input-box" id="factDetail" placeholder="Fact detail or instruction to remember across sessions..." />
        
      </div>
      <div id="saveStatus" style="font-size:0.75rem; color:var(--accent-green); min-height:16px;"></div>
    </div>

    <!-- Search & Filter Bar -->
    <div class="filter-bar">
      <input type="text" class="search-input" id="searchFacts" placeholder="🔍 Search memory concepts and fact contents..." oninput="filterFacts()" />
      
    </div>

    <!-- Facts Grid -->
    <div class="facts-grid" id="factsContainer">
      <div style="color:var(--text-muted); font-size:0.85rem;">Loading learned knowledge facts...</div>
    </div>

  </main>

  <script>
    let allFacts = [];

    async function fetchFacts() {
      try {
        const res = await fetch('/api/memory/facts');
        if (!res.ok) throw new Error('Failed to load facts');
        const data = await res.json();
        allFacts = data.facts || [];

        // Update stats
        document.getElementById('statTotalFacts').textContent = allFacts.length;
        const concepts = new Set(allFacts.map(f => (f.concept || '').trim()).filter(Boolean));
        document.getElementById('statTotalConcepts').textContent = concepts.size;

        renderFacts(allFacts);
      } catch(e) {
        document.getElementById('factsContainer').innerHTML = `<div style="color:var(--accent-red);">Could not load facts: ${e.message}</div>`;
      }
    }

    function renderFacts(facts) {
      const container = document.getElementById('factsContainer');
      container.innerHTML = '';

      if (!facts || facts.length === 0) {
        container.innerHTML = `<div style="color:var(--text-muted); font-size:0.85rem;">No memory facts found matching your criteria. Add one above!</div>`;
        return;
      }

      facts.forEach(fact => {
        const card = document.createElement('div');
        card.className = 'fact-card';
        card.innerHTML = `
          <div class="fact-header">
            <span class="concept-badge">${escapeHtml(fact.concept || 'General')}</span>
            
          </div>
          <div class="fact-content">${escapeHtml(fact.facts || '')}</div>
          <div class="fact-footer">
            <span>ID: #${fact.id}</span>
            <span>${escapeHtml(fact.timestamp || 'Recorded')}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function saveNewFact() {
      const cInput = document.getElementById('factConcept');
      const dInput = document.getElementById('factDetail');
      const status = document.getElementById('saveStatus');

      const concept = cInput.value.trim();
      const fact = dInput.value.trim();

      if (!concept || !fact) {
        status.textContent = 'Please enter both Concept and Fact detail.';
        status.style.color = 'var(--accent-red)';
        return;
      }

      status.textContent = 'Saving to database...';
      status.style.color = 'var(--accent-cyan)';

      try {
        const res = await fetch('/api/memory/facts', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ concept, fact })
        });
        if (!res.ok) throw new Error('Save error');
        
        status.textContent = 'Fact stored successfully in persistent memory!';
        status.style.color = 'var(--accent-green)';
        cInput.value = '';
        dInput.value = '';
        fetchFacts();
        setTimeout(() => { status.textContent = ''; }, 3000);
      } catch(e) {
        status.textContent = 'Error saving fact: ' + e.message;
        status.style.color = 'var(--accent-red)';
      }
    }

    async function deleteFact(factId) {
      if (!confirm('Are you sure you want to delete this memory fact?')) return;
      try {
        const res = await fetch(`/api/memory/facts/${factId}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('Delete error');
        fetchFacts();
      } catch(e) {
        alert('Could not delete fact: ' + e.message);
      }
    }

    function filterFacts() {
      const query = (document.getElementById('searchFacts').value || '').toLowerCase();
      if (!query) {
        renderFacts(allFacts);
        return;
      }
      const filtered = allFacts.filter(f => 
        (f.concept || '').toLowerCase().includes(query) ||
        (f.facts || '').toLowerCase().includes(query)
      );
      renderFacts(filtered);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // Initialize
    fetchFacts();
  </script>
</body>
</html>
